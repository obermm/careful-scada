[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careful-scada"
version = "0.1.0"
description = "A preprocessing library for the CARE open source SCADA data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy>=2.0",
	"pandas>=2.0",
	"plotly>=5.0",
	"PyYAML>=6.0",
	"scikit-learn>=1.4",
]

[project.optional-dependencies]
# LSTM, physics-constrained RNN and Kalman model (JAX/Flax)
deep = [
	"jax>=0.4",
	"flax>=0.8",
	"optax>=0.2",
]
# notebooks, example scripts and tests
dev = [
	"ipykernel>=6.0",
	"matplotlib>=3.7",
	"pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["care_scada"]