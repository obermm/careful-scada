  gen_rpm_avg:
    description: "Generator RPM"
    unit: "RPM"
    farm_mappings:
      A: ["sensor_18_avg"]
      B: ["sensor_19_avg"]
      C: ["sensor_8_avg"]
    unit_conversions:
      C: "rad_to_rpm"  # multiply by 60/(2*pi)
    thresholds:
      absolute: [0, 2000]
      gradient: 1000
      flatline: 1008
