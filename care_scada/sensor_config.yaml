    rarely_zero: true
    
  gearbox_oil_temp1_c_avg:
    description: "Gearbox oil temperature 1"
    unit: "°C"
    farm_mappings:
      A: ["sensor_12_avg"]
      B: ["sensor_38_avg"]
      C: ["sensor_189_avg"]
    thresholds:
      absolute: [0, 80]
      gradient: 12
      flatline: 144
      drift: 576
    rarely_zero: true
    
  gearbox_oil_temp2_c_avg:
    description: "Gearbox oil temperature 2"
    unit: "°C"
