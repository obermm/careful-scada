# Sensor Configuration - unified schema and thresholds
# Combines farm-specific mappings (anonymized sensor names to standardized names) 
# with domain-specific validation rules


# Global preprocessing settings
settings:
  short_interior_threshold: 6  # 1 hour
  max_consecutive_zeros: 72  # 12 hours
  gradient_tolerance: 0.01
  
  # Preprocessor settings
  preprocessing:
    missing_values_strategy: "linear_interpolation"  # Options: "keep", "drop", "linear_interpolation", "median"
    outlier_handling: "flag_only"  # Options: "flag_only", "set_to_nan", "drop"
    remove_status: None  # Remove none


sensors:
  outside_temp_c_avg:
    description: "Outside temperature (°C)"
    unit: "°C"
    farm_mappings:
      A: ["sensor_0_avg"]
      B: ["sensor_8_avg"]
      C: ["sensor_177_avg"]
    thresholds:
      absolute: [-50, 50]
      gradient: 8  # max change per 10min
      flatline: 144  # max 24 hours
      drift: 72  # max 12 hours
    rarely_zero: true
    
  rotor_speed_rpm_avg:
    description: "Rotor speed (RPM)"
    unit: "RPM"
    farm_mappings:
      A: ["sensor_52_avg"]
      B: ["sensor_25_avg"]
      C: ["sensor_144_avg"]
    thresholds:
      absolute: [-0.05, 30]
      gradient: 20
      flatline: 1008  # 7 days
      drift: 72
    
  active_power_kWh:
    description: "Active power output"
    unit: "kWh"
    farm_mappings:
      A: ["sensor_50"]
      B: ["sensor_3_avg"]
      C: ["power_6_avg"]
    unit_conversions:
      A: "Wh_to_kWh"  # divide by 1000
    thresholds:
      absolute: [-100, 5000]
      gradient: 2000
      flatline: 1008
      drift: 72
    
  wind_speed1_ms_avg:
    description: "Wind speed sensor 1"
    unit: "m/s"
    farm_mappings:
      A: ["wind_speed_3_avg"]
      B: ["wind_speed_59_avg"]
      C: ["wind_speed_235_avg"]
    thresholds:
      absolute: [0, 50]
      gradient: 12
      flatline: 144
      drift: 72
    
  wind_speed2_ms_avg:
    description: "Wind speed sensor 2"
    unit: "m/s"
    farm_mappings:
      A: ["wind_speed_4_avg"]
      B: ["wind_speed_60_avg"]
      C: ["wind_speed_237_avg"]
    thresholds:
      absolute: [0, 50]
      gradient: 12
      flatline: 36
      drift: 72
    
  wind_speed3_ms_avg:
    description: "Wind speed sensor 3"
    unit: "m/s"
    farm_mappings:
      B: ["wind_speed_61_avg"]
      C: ["wind_speed_236_avg"]
    thresholds:
      absolute: [0, 50]
      gradient: 12
      flatline: 36
      drift: 72
    
  main_bearing_temp1_c_avg:
    description: "Main bearing temperature 1"
    unit: "°C"
    farm_mappings:
      B: ["sensor_51_avg"]
      C: ["sensor_196_avg"]
    thresholds:
      absolute: [0, 80]
      gradient: 6
      flatline: 144
      drift: 576  # 4 days
    rarely_zero: true

  main_bearing_temp1_c_std:
    description: "Main bearing temperature 1 (std dev)"
    unit: "°C"
    farm_mappings:
      B: ["sensor_51_min"] # Not a bug, the column names in the data are obviously not mixed up.
    thresholds:
      absolute: [0, 1]
      gradient: 1
      flatline: 144
      drift: 576  # 4 days
    rarely_zero: false

  main_bearing_temp1_c_max:
    description: "Main bearing temperature 1 (max)"
    unit: "°C"
    farm_mappings:
      B: ["sensor_51_max"]
    thresholds:
      absolute: [0, 80]
      gradient: 6
      flatline: 144
      drift: 576  # 4 days
    rarely_zero: true

  main_bearing_temp1_c_min:
    description: "Main bearing temperature 1 (min)"
    unit: "°C"
    farm_mappings:
      B: ["sensor_51_std"] # Not a bug, the column names in the data are obviously not mixed up.
    thresholds:
      absolute: [0, 80]
      gradient: 6
      flatline: 144
      drift: 576  # 4 days
    rarely_zero: true

  main_bearing_temp2_c_avg:
    description: "Main bearing temperature 2"
    unit: "°C"
    farm_mappings:
      B: ["sensor_52_avg"]
      C: ["sensor_197_avg"]
    thresholds:
      absolute: [0, 80]
      gradient: 6
      flatline: 144
      drift: 576
    rarely_zero: true

  main_bearing_temp2_c_std:
    description: "Main bearing temperature 2 (std dev)"
    unit: "°C"
    farm_mappings:
      B: ["sensor_52_min"] # Not a bug, the column names in the data are obviously not mixed up.
    thresholds:
      absolute: [0, 1]
      gradient: 1
      flatline: 144
      drift: 576
    rarely_zero: false

  main_bearing_temp2_c_max:
    description: "Main bearing temperature 2 (max)"
    unit: "°C"
    farm_mappings:
      B: ["sensor_52_max"]
    thresholds:
      absolute: [0, 80]
      gradient: 6
      flatline: 144
      drift: 576
    rarely_zero: true

  main_bearing_temp2_c_min:
    description: "Main bearing temperature 2 (min)"
    unit: "°C"
    farm_mappings:
      B: ["sensor_52_std"] # Not a bug, the column names in the data are obviously not mixed up.
    thresholds:
      absolute: [0, 80]
      gradient: 6
      flatline: 144
      drift: 576
    rarely_zero: true

  main_bearing_temp3_c_avg:
