    farm_mappings:
      A: ["sensor_5_avg"]
      B: ["sensor_10_avg"]
      C: ["sensor_76_avg"]
    thresholds:
      absolute: [-5, 95]
      gradient: 45
      flatline: 1008  # 7 days
      drift: 72
    
  gearbox_bearing_temp1_c_avg:
    description: "Gearbox bearing temperature 1"
    unit: "°C"
    farm_mappings:
      A: ["sensor_11_avg"]
      B: ["sensor_34_avg"]
    thresholds:
      absolute: [0, 100]
      gradient: 8
      flatline: 144
      drift: 576
    rarely_zero: true
    
  gearbox_bearing_temp2_c_avg:
    description: "Gearbox bearing temperature 2"
    unit: "°C"
    farm_mappings:
      B: ["sensor_35_avg"]
    thresholds:
      absolute: [0, 100]
      gradient: 8
      flatline: 144
      drift: 576
    rarely_zero: true
    
  gearbox_bearing_temp3_c_avg:
    description: "Gearbox bearing temperature 3"
    unit: "°C"
    farm_mappings:
      B: ["sensor_36_avg"]
    thresholds:
      absolute: [0, 100]
      gradient: 8
      flatline: 144
      drift: 576
    rarely_zero: true
    
  gearbox_bearing_temp4_c_avg:
